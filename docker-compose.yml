
services:
  postgres:
    image: postgres:18
    container_name: cinema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema_user
      POSTGRES_PASSWORD: cinema_password
      POSTGRES_DB: cinema_db
    ports:
      - "5433:5432"
    volumes:
      - cinema_postgres_data:/var/lib/postgresql

volumes:
  cinema_postgres_data:
